[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asccd"
version = "0.1.0"
description = "Adaptive Supply Chain Cyber Defense Using GAN-Generated Attack Scenarios and Reinforcement Learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "C A Anandavarthan", email = "anandavarthan@dsu.edu.in"},
    {name = "Deekshay G", email = "deekshay@dsu.edu.in"},
    {name = "Dev Virat", email = "devvirat@dsu.edu.in"},
]

dependencies = [
    # Core
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # Deep Learning
    "torch>=2.0",
    # GAN
    "sdv>=1.10",
    "ctgan>=0.10",
    # Reinforcement Learning
    "gymnasium>=0.29",
    "stable-baselines3>=2.1",
    # Backend
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.6",
    # Visualization
    "matplotlib>=3.7",
    "plotly>=5.18",
    # Experiment Tracking
    "mlflow>=2.8",
    # Configuration
    "pyyaml>=6.0",
    # Logging
    "structlog>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "ruff>=0.1",
    "black>=23.10",
    "mypy>=1.6",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
