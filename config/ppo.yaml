# ============================================================
# ASCCD PPO Configuration (Optional)
# ============================================================

ppo:
  algorithm: "PPO"
  policy: "MlpPolicy"

  # Hyperparameters
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

  # Network
  net_arch:
    pi: [256, 256]
    vf: [256, 256]

  # Training
  total_timesteps: 100000
  seed: 42

  # Checkpointing
  checkpoint_dir: "artifacts/models/ppo"
  save_freq: 10000

  # Evaluation
  eval_freq: 5000
  n_eval_episodes: 10

  # Development mode
  dev_mode:
    enabled: true
    total_timesteps: 10000
